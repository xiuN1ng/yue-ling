<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月令</title>
<style>
:root{--bg:#16130f;--panel:#221c16;--ink:#eadfc8;--mute:#8b7f6c;--gold:#c9a45c;--red:#b44a3c;--line:#3b3329;--ok:#6a8f5a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif}
body{display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;letter-spacing:.28em;font-weight:600}
.top{display:flex;gap:16px;font-size:13px;color:var(--gold)}
.top b{color:var(--ink)}
.wrap{flex:1;display:grid;grid-template-columns:220px 1fr 220px;min-height:0}
@media(max-width:900px){.wrap{grid-template-columns:1fr}aside{border:0;border-top:1px solid var(--line)}}
aside{padding:12px;overflow:auto;background:var(--panel)}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
h2{font-size:12px;letter-spacing:.24em;color:var(--gold);margin:0 0 8px}
.who{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.seal{width:44px;height:44px;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;letter-spacing:.2em;font-size:15px}
.kv{display:flex;justify-content:space-between;font-size:13px;margin:3px 0;color:var(--mute)}
.kv b{color:var(--ink);font-weight:600}
.bar{height:6px;background:#2c261f;margin:2px 0 8px}
.bar>i{display:block;height:100%;background:var(--gold)}
.skill{border:1px solid var(--line);padding:7px 8px;margin:6px 0;cursor:pointer;font-size:13px}
.skill.on{border-color:var(--gold);background:#2b241c}
.skill .n{color:var(--gold)}
.skill .d{color:var(--mute);font-size:12px;margin-top:2px}
.map{position:relative;min-height:460px;background:radial-gradient(ellipse at 50% 42%,#2a231c,var(--bg) 72%)}
.node{position:absolute;width:128px;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--gold);padding:10px 8px;text-align:center;cursor:pointer}
.node:hover{background:#2d261e}
.node.empty{border-color:var(--line);color:var(--mute)}
.node .name{letter-spacing:.2em;font-size:16px}
.node .m{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.45}
#town{left:50%;top:26%}#sect{left:20%;top:58%}#market{left:80%;top:58%}#wild{left:50%;top:84%}
svg.r{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#log p{font-size:12px;color:var(--mute);line-height:1.5;margin:0 0 8px}
.hint{padding:8px 16px 12px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
.ov{position:fixed;inset:0;background:rgba(8,6,4,.75);display:none;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.card{width:min(460px,100%);background:#1f1a15;border:1px solid var(--gold);padding:18px}
.card h3{font-size:15px;letter-spacing:.16em;color:var(--gold);margin-bottom:8px}
.card .body{font-size:15px;line-height:1.7;margin-bottom:12px}
.btns button,.menu button{display:block;width:100%;text-align:left;margin:0 0 7px;padding:9px 10px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer}
.btns button:hover,.menu button:hover{border-color:var(--gold)}
.clog{height:168px;overflow:auto;background:#16120e;border:1px solid var(--line);padding:8px;font-size:13px;line-height:1.55;margin:8px 0}
.clog .hit{color:var(--red)}
.clog .you{color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>月令</h1>
  <div class="top">
    <span>第 <b id="month">1</b> 月</span>
    <span><b id="title">座上客</b></span>
    <span>钱 <b id="money">60</b></span>
  </div>
</header>
<div class="wrap">
  <aside class="left">
    <h2>人物</h2>
    <div class="who"><div class="seal">沈</div><div><div>沈衡</div><div style="color:var(--mute);font-size:12px" id="sub">旧笔在手</div></div></div>
    <div class="kv">身份 <b id="rank">74</b></div>
    <div class="bar"><i id="rankBar" style="width:74%"></i></div>
    <div class="kv">笔力 <b id="sBi">14</b></div><div class="bar"><i id="bBi"></i></div>
    <div class="kv">眼力 <b id="sYan">9</b></div><div class="bar"><i id="bYan"></i></div>
    <div class="kv">气势 <b id="sQi">11</b></div><div class="bar"><i id="bQi"></i></div>
    <div class="kv">心性 <b id="sXin">10</b></div><div class="bar"><i id="bXin"></i></div>
    <h2 style="margin-top:14px">功法 · 点选装备</h2>
    <div id="skills"></div>
  </aside>
  <div class="map">
    <svg class="r" viewBox="0 0 100 100" preserveAspectRatio="none">
      <line x1="50" y1="26" x2="20" y2="58" stroke="#3b3329" stroke-width=".45"/>
      <line x1="50" y1="26" x2="80" y2="58" stroke="#3b3329" stroke-width=".45"/>
      <line x1="20" y1="58" x2="50" y2="84" stroke="#3b3329" stroke-width=".45"/>
      <line x1="80" y1="58" x2="50" y2="84" stroke="#3b3329" stroke-width=".45"/>
    </svg>
    <div class="node" id="town" data-id="town"></div>
    <div class="node" id="sect" data-id="sect"></div>
    <div class="node" id="market" data-id="market"></div>
    <div class="node" id="wild" data-id="wild"></div>
  </div>
  <aside class="right">
    <h2>月记</h2>
    <div id="log"></div>
  </aside>
</div>
<p class="hint">点地点：办事 / 驻留 / 比试。每月一次。功法左边点一下换上。</p>
<div class="ov" id="ov"><div class="card" id="card"></div></div>
<script>
const LOC = {
  town:{name:"城镇",pop:12,pro:6,stb:5},
  sect:{name:"宗门",pop:8,pro:4,stb:7},
  market:{name:"市集",pop:14,pro:8,stb:3},
  wild:{name:"山野",pop:5,pro:2,stb:4}
};
const SK = {
  brush:{name:"旧笔",own:true,eq:true,d:"写、改、评。第四月后力减半。",atk:8,stat:"bi"},
  eye:{name:"评嘴",own:false,eq:false,d:"看事准，办事多钱。",atk:5,stat:"yan"},
  box:{name:"铜箱诀",own:false,eq:false,d:"一月顶从前数月。用则四处人少。",atk:14,stat:"qi"},
  gate:{name:"守门",own:false,eq:false,d:"硬扛。驻留时人不易走。",atk:6,stat:"xin"}
};
const S = {month:1,money:60,rank:74,bi:14,yan:9,qi:11,xin:10,busy:false,end:false,boxSeen:false};

function $(id){return document.getElementById(id)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function title(){
  if(S.rank>=70) return "座上客";
  if(S.rank>=45) return "识者";
  if(S.rank>=22) return "散人";
  return "无籍";
}
function eqSkill(){return Object.keys(SK).map(k=>SK[k]).find(x=>x.eq&&x.own) || SK.brush}
function late(){return S.month>=4}
function atkBonus(){
  const sk=eqSkill();
  let a=sk.atk;
  if(sk===SK.brush && late()) a=Math.floor(a/2);
  return a;
}
function log(t){
  const p=document.createElement("p");
  p.textContent="第"+S.month+"月　"+t;
  $("log").prepend(p);
}
function setBar(id,v){$(id).style.width=clamp(v,0,20)/20*100+"%"}
function render(){
  $("month").textContent=S.month;
  $("money").textContent=S.money;
  $("rank").textContent=S.rank;
  $("title").textContent=title();
  $("rankBar").style.width=S.rank+"%";
  $("sBi").textContent=S.bi; $("sYan").textContent=S.yan; $("sQi").textContent=S.qi; $("sXin").textContent=S.xin;
  setBar("bBi",S.bi); setBar("bYan",S.yan); setBar("bQi",S.qi); setBar("bXin",S.xin);
  $("sub").textContent=eqSkill().name+" · "+title();
  const box=$("skills"); box.innerHTML="";
  for(const k of Object.keys(SK)){
    const s=SK[k]; if(!s.own) continue;
    const d=document.createElement("div");
    d.className="skill"+(s.eq?" on":"");
    d.innerHTML="<div class='n'>"+s.name+(s.eq?" · 装备":"")+"</div><div class='d'>"+s.d+"</div>";
    d.onclick=()=>{Object.keys(SK).forEach(i=>SK[i].eq=false); s.eq=true; render(); log("换上"+s.name+"。");};
    box.appendChild(d);
  }
  for(const id of Object.keys(LOC)){
    const L=LOC[id], n=$(id);
    n.className="node"+(L.pop<=0?" empty":"");
    n.innerHTML="<div class='name'>"+L.name+"</div><div class='m'>人 "+L.pop+"　繁荣 "+L.pro+"<br>稳定 "+L.stb+"</div>";
  }
}
function openC(html){$("card").innerHTML=html; $("ov").classList.add("show")}
function closeC(){$("ov").classList.remove("show"); $("card").innerHTML=""}

function addStat(k,n){S[k]=clamp(S[k]+n,1,20)}
function addRank(n){S.rank=clamp(S.rank+n,0,100)}
function addPop(id,n){LOC[id].pop=Math.max(0,LOC[id].pop+n)}
function addPro(id,n){LOC[id].pro=clamp(LOC[id].pro+n,0,12)}
function addStb(id,n){LOC[id].stb=clamp(LOC[id].stb+n,0,12)}
function decayWorld(n){
  for(const id of Object.keys(LOC)){
    addPop(id,-n);
    if(LOC[id].pop<=2) addPro(id,-1);
  }
}

function nextMonth(note){
  if(note) log(note);
  if(eqSkill()===SK.box) decayWorld(1);
  for(const id of Object.keys(LOC)){
    if(LOC[id].pop===0) addPro(id,-1);
  }
  S.month++;
  S.busy=false;
  render();
  if(S.month>18){S.end=true; log("十八个月了。日历还在。");}
}

function autoFight(foe,pow,onWin,onLose){
  const youHp0=24+S.xin*2+Math.floor(S.rank/8);
  const foeHp0=18+pow;
  let you=youHp0, foe=foeHp0;
  const sk=eqSkill();
  openC("<h3>比试</h3><div class='body'>对上"+foeName(foe,pow)+"　装备【"+sk.name+"】</div><div class='clog' id='clog'></div>");
  const clog=$("clog");
  function line(t,cls){
    const p=document.createElement("div");
    if(cls) p.className=cls;
    p.textContent=t; clog.appendChild(p); clog.scrollTop=clog.scrollHeight;
  }
  line("沈衡 气血 "+youHp0+"　"+foeName(foe,pow)+" 气血 "+foeHp0);
  const tick=setInterval(()=>{
    const ya=4+Math.floor(S.qi/2)+atkBonus()+Math.floor(Math.random()*6);
    foe=Math.max(0,foe-ya);
    line("你 使出【"+sk.name+"】 造成 "+ya+"　敌余 "+foe,"you");
    if(foe<=0){
      clearInterval(tick); line("你胜。","you");
      setTimeout(()=>{closeC(); onWin();},700); return;
    }
    const fa=3+Math.floor(pow/8)+Math.floor(Math.random()*7);
    you=Math.max(0,you-fa);
    line(foeName(foe,pow)+" 还手 造成 "+fa+"　你余 "+you,"hit");
    if(you<=0){
      clearInterval(tick); line("你败。","hit");
      setTimeout(()=>{closeC(); onLose();},700);
    }
  },280);
}
function foeName(_,pow){
  if(pow>=78) return "掌门";
  if(pow>=68) return "守箱人";
  if(pow>=55) return "师兄";
  return "市井好手";
}

function menu(id){
  if(S.busy||S.end) return;
  const L=LOC[id];
  openC("<h3>"+L.name+"</h3><div class='body'>人 "+L.pop+"　繁荣 "+L.pro+"　稳定 "+L.stb+"</div><div class='menu' id='m'></div>");
  const m=$("m");
  const b1=btn("办事　触发一事"); b1.onclick=()=>{closeC(); doEvent(id)};
  const b2=btn("驻留　修炼、养这个地方"); b2.onclick=()=>{closeC(); stay(id)};
  const b3=btn("比试　自动打一场"); b3.onclick=()=>{closeC(); fightHere(id)};
  m.append(b1,b2,b3);
}
function btn(t){const b=document.createElement("button"); b.textContent=t; return b}

function stay(id){
  S.busy=true;
  addStat(eqSkill().stat,1);
  addPro(id,1);
  if(eqSkill()===SK.gate) addStb(id,2);
  else addStb(id,1);
  if(eqSkill()!==SK.box && Math.random()<0.35) addPop(id,1);
  S.money=Math.max(0,S.money-3);
  nextMonth("驻留"+LOC[id].name+"。"+eqSkill().name+"有长进。");
}

function fightHere(id){
  S.busy=true;
  const pow = id==="sect"? (late()?78:55) : id==="wild"?70:48;
  autoFight("x",pow,
    ()=>{ addRank(4); addStat("qi",1); S.money+=8;
      if(id==="wild"&&!SK.box.own){SK.box.own=true; log("你在山里翻到残页：铜箱诀。");}
      if(id==="market"&&!SK.eye.own){SK.eye.own=true; log("评嘴，你听会了。");}
      if(id==="sect"&&!SK.gate.own){SK.gate.own=true; log("守门，掌门随手教了一招。");}
      render(); nextMonth("比试赢了。");
    },
    ()=>{ addRank(-7); addStat("xin",-1); S.money=Math.max(0,S.money-6); nextMonth("比试输了。身份往下掉。"); }
  );
}

function choices(title,body,arr){
  openC("<h3>"+title+"</h3><div class='body'>"+body+"</div><div class='btns' id='ch'></div>");
  const box=$("ch");
  arr.forEach((c,i)=>{
    const b=btn((i+1)+"　"+c.t);
    b.onclick=()=>{ if(c.fight){ closeC(); autoFight("x",c.fight,
      ()=>{c.win(); closeC();},
      ()=>{c.lose(); closeC();}
    );} else { c.go(); closeC(); } };
    box.appendChild(b);
  });
}

function doEvent(id){
  S.busy=true;
  const L=LOC[id];
  if(L.pop<=0){
    choices(L.name,"地方还在。人已经不在。字还贴着，很齐。",[
      {t:"看一看",go:()=>{addRank(-2); nextMonth("空的。字很齐。");}},
      {t:"离开",go:()=>{nextMonth("你没停留。");}}
    ]); return;
  }
  if(id==="town"){
    if(!late()) choices("城镇","里正把告示递过来，请你改两个字。门外有人排队等抄。",[
      {t:"亲自改　笔力说话",go:()=>{const n=SK.brush.eq?(late()?1:4):2; addRank(n); addStat("bi",1); S.money+=6; nextMonth("告示换了字。人还在排队。");}},
      {t:"让门外的人抄，你署名",go:()=>{S.money+=12; addPop("town",-1); addRank(1); nextMonth("告示发出去了。抄的人少了一个。");}},
      {t:"不改",go:()=>{addRank(-1); nextMonth("你没动手。");}}
    ]);
    else choices("城镇","里正手里已有印好的告示，不是人写的。他问你：要不要把这法子推开。",[
      {t:"推开　四处少人，你的身份涨",go:()=>{SK.box.own=true; S.money+=16; addRank(8); decayWorld(1); addPop("town",-2); nextMonth("告示一夜贴满。门口更少了。");}},
      {t:"只看一眼",go:()=>{addRank(-4); addStat("yan",1); nextMonth("字很齐。没有笔迹。");}},
      {t:"把旧笔的人留下",go:()=>{S.money=Math.max(0,S.money-10); addStb("town",2); addRank(-1); nextMonth("你掏了钱。人没走几个。");}}
    ]);
  }
  if(id==="sect"){
    if(!late()) choices("宗门","师兄还在教旧功法。门外比往年少。他请你看一场。",[
      {t:"帮他教",go:()=>{addStat("bi",1); addStb("sect",1); addRank(2); nextMonth("你教了一上午。人还在。");}},
      {t:"劝他换新器",go:()=>{SK.box.own=true; S.money+=10; addPop("sect",-2); addRank(3); nextMonth("师兄试了。下午人少了两个。");}},
      {t:"比试师兄",fight:55,win:()=>{addRank(5); addStat("qi",1); SK.gate.own=true; render(); nextMonth("你赢了。守门，你看会了。");},lose:()=>{addRank(-6); S.money=Math.max(0,S.money-4); nextMonth("你输了。院子里有人低头。");}}
    ]);
    else choices("宗门","掌门说外门很多已经不练了。柴房里有一口箱子能代练。",[
      {t:"同意代练",go:()=>{SK.box.own=true; SK.box.eq=true; SK.brush.eq=false; addRank(10); addPop("sect",-3); decayWorld(1); render(); nextMonth("箱子进了柴房。外门更静。");}},
      {t:"请留人手",go:()=>{S.money=Math.max(0,S.money-12); addStb("sect",2); addPop("sect",1); nextMonth("你掏了钱。人没走几个。");}},
      {t:"比试掌门",fight:80,win:()=>{addRank(7); SK.gate.own=true; render(); nextMonth("你赢了。掌门没再提箱子。");},lose:()=>{addRank(-9); addPop("sect",-1); nextMonth("你输了。有人连夜下山。");}}
    ]);
  }
  if(id==="market"){
    if(!late()) choices("市集","铺子请你写招牌。学徒磨墨等你落笔。",[
      {t:"自己写",go:()=>{S.money+=8+ (SK.eye.eq?4:0); addStat("bi",1); addPro("market",1); nextMonth("招牌挂上。学徒还在。");}},
      {t:"学徒写，你署名",go:()=>{S.money+=16; addPop("market",-1); addRank(2); nextMonth("招牌挂上。学徒晚上没回来。");}},
      {t:"不写，去听行情",go:()=>{SK.eye.own=true; addStat("yan",1); render(); nextMonth("评嘴，你在市声里听会了。");}}
    ]);
    else choices("市集","有人卖现成招牌，一天二十块，字一个样。请你入股。",[
      {t:"入股",go:()=>{SK.box.own=true; S.money+=24; addRank(6); addPop("market",-2); addPro("market",-1); nextMonth("钱来了。写字的摊少了。");}},
      {t:"买一块回去拆",go:()=>{S.money=Math.max(0,S.money-5); addStat("yan",2); nextMonth("字很齐。没有笔锋。");}},
      {t:"不入，继续手写",go:()=>{S.money=Math.max(0,S.money-8); addRank(-3); addStb("market",1); nextMonth("旧活没人问。你还在写。");}}
    ]);
  }
  if(id==="wild"){
    if(!SK.box.own && S.month>=3) choices("山野","树下有一口铜箱。旁写：投进去的字会自己出来，更快更齐。土是新的，像有人坐过。",[
      {t:"投一次并记下法门",go:()=>{SK.box.own=true; SK.box.eq=true; SK.brush.eq=false; addRank(12); S.money+=10; decayWorld(1); render(); nextMonth("字出来了。下山时路上人少。铜箱诀入包。");}},
      {t:"只看，不投",go:()=>{S.boxSeen=true; addStat("yan",1); nextMonth("你没投。箱子还在。");}},
      {t:"砸箱子",fight:70,win:()=>{addRank(2); addStat("qi",1); nextMonth("箱子凹了一块。还在响。");},lose:()=>{addRank(-10); S.money=Math.max(0,S.money-6); nextMonth("你被打下山。箱子还在。");}}
    ]);
    else if(SK.box.own) choices("山野","铜箱还在。投一次，能顶从前一个月的活。",[
      {t:"再投",go:()=>{addRank(8); S.money+=14; decayWorld(1); addStat("qi",1); nextMonth("字又出来了。路更静。");}},
      {t:"守着不让别人投",fight:62,win:()=>{addRank(3); addPop("wild",-1); nextMonth("来的人走了。");},lose:()=>{addRank(-4); decayWorld(1); nextMonth("别人投了。你看着。");}},
      {t:"空手下山",go:()=>{S.money=Math.max(0,S.money-2); nextMonth("你空手下山。");}}
    ]);
    else choices("山野","山里只有风。猎人问你城里的活还好不好接。",[
      {t:"说还好",go:()=>{addRank(1); nextMonth("猎人嗯了一声。");}},
      {t:"说不好接了",go:()=>{addStat("xin",1); nextMonth("猎人没再问。");}},
      {t:"在山里硬练一个月",go:()=>{addStat("qi",2); addStat("xin",1); S.money=Math.max(0,S.money-4); nextMonth("气势长了。身上空了。");}}
    ]);
  }
}

["town","sect","market","wild"].forEach(id=>$(id).onclick=()=>menu(id));
log("你还被人认得。旧笔在手。这个月去哪儿。");
render();
</script>
</body>
</html>
